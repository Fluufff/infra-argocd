# Used by GitHub CI to push image updates
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: update-website-image
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["website"]
  verbs: ["get","list","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-update-website-image
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: update-website-image
subjects:
- kind: ServiceAccount
  name: github-actions
---
# Used by SecHub instances to read the cluster
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: github-actions-token
  annotations:
    kubernetes.io/service-account.name: github-actions
