apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    {{- include "vikunja.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: vikunja
  name: vikunja
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja
      app.kubernetes.io/component: vikunja
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: vikunja
        app.kubernetes.io/component: vikunja
    spec:
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      hostNetwork: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
      - name: config
        configMap:
          name: config
      containers:
      - name: vikunja
        image: {{ .Values.images.vikunja }}
        env:
        - name: VIKUNJA_SERVICE_PUBLICURL
          value: https://vikunja.next.fluufff.org
        - name: VIKUNJA_DATABASE_HOST
          value: postgres
        - name: VIKUNJA_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-admin
              key: pass
        - name: VIKUNJA_DATABASE_TYPE
          value: postgres
        - name: VIKUNJA_DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: postgres-admin
              key: user
        - name: VIKUNJA_DATABASE_DATABASE
          value: vikunja
        - name: VIKUNJA_SERVICE_JWTSECRET
          valueFrom:
            secretKeyRef:
              name: jwt
              key: secret
        # - name: VIKUNJA_AUTH_OPENID_ENABLED
        #   value: "true"
        # - name: VIKUNJA_AUTH_OPENID_PROVIDERS_0_NAME
        #   value: Google
        # - name: VIKUNJA_AUTH_OPENID_PROVIDERS_0_AUTHURL
        #   value: https://accounts.google.com
        # - name: VIKUNJA_AUTH_OPENID_PROVIDERS_0_CLIENTID
        #   valueFrom:
        #     secretKeyRef:
        #       name: google-auth
        #       key: id
        # - name: VIKUNJA_AUTH_OPENID_PROVIDERS_0_CLIENTSECRET
        #   valueFrom:
        #     secretKeyRef:
        #       name: google-auth
        #       key: secret
        securityContext:
          {{- toYaml .Values.podSecurityContext | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /app/vikunja/files
          readOnly: false
        - name: config
          mountPath: /etc/vikunja
          readOnly: true
        resources:
          {{- include "vikunja.resources" .Values.resources.vikunja | nindent 10 }}
