apiVersion: v1
kind: Namespace
metadata:
  name: platyplus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platyplus
  namespace: platyplus
  labels:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: platyplus
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platyplus
      app.kubernetes.io/component: platyplus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platyplus
        app.kubernetes.io/component: platyplus
    spec:
      volumes:
      - name: code
        hostPath:
          path: /data/platyplus/code
          type: Directory
      - name: config
        hostPath:
          path: /data/platyplus/config
          type: Directory
      - name: assets
        hostPath:
          path: /data/platyplus/assets
          type: Directory
      imagePullSecrets:
      - name: ghcr
      containers:
      - image: ghcr.io/fluufff/platyplus:07-03-2026
        name: platyplus
        resources: {}
        env:
        - name: CI_ENV
          value: "production"
        - name: PHP_OPCACHE_VALIDATE_TIMESTAMPS
          value: "1"
        volumeMounts:
        - name: code
          mountPath: /var/www/html
          readOnly: true
        - name: assets
          mountPath: /var/www/html/assets
          readOnly: false
        - name: config
          mountPath: /var/www/html/platyplus/config/production
          readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: platyplus
  namespace: platyplus
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: platyplus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: platyplus
  ports:
  - name: HTTP
    port: 80
    protocol: TCP
    targetPort: 80
---
