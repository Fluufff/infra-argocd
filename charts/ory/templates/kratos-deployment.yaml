apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: ory
    app.kubernetes.io/component: kratos
  name: kratos
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ory
      app.kubernetes.io/component: kratos
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: ory
        app.kubernetes.io/component: kratos
    spec:
      volumes:
        - name: kratos-data
          persistentVolumeClaim:
            claimName: kratos-data
        - name: kratos-config
          configMap:
            name: kratos-config
        - name: tmp
          emptyDir:
            medium: Memory
        - name: run
          emptyDir:
            medium: Memory
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      hostNetwork: false
      securityContext:
        {{- toYaml .Values.kratos.podSecurityContext | nindent 8 }}
      initContainers:
        - name: ensure-db-folder
          image: {{ .Values.kratos.image }}
          command: ["mkdir"]
          args: ["-p", "/var/lib/kratos/sqlite"]
          securityContext:
            {{- toYaml .Values.kratos.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: kratos-data
              mountPath: /var/lib/kratos
        - name: migrate
          image: {{ .Values.kratos.image }}
          command: ["kratos"]
          args: ["migrate", "sql", "up", "--read-from-env", "--yes"]
          securityContext:
            {{- toYaml .Values.kratos.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: kratos-data
              mountPath: /var/lib/kratos
          env:
            - name: DSN
              value: sqlite:///var/lib/kratos/sqlite/db.sqlite?_fk=true&mode=rwc
      containers:
        - name: kratos
          image: {{ .Values.kratos.image }}
          command: ["kratos"]
          args: ["-c", "/etc/kratos/kratos.yml", "serve", "--dev", "--watch-courier"]
          volumeMounts:
            - name: kratos-data
              mountPath: /var/lib/kratos
            - name: kratos-config
              mountPath: /etc/kratos
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/kratos
          env:
            - name: DSN
              value: sqlite:///var/lib/kratos/sqlite/db.sqlite?_fk=true&mode=rwc
          envFrom:
          - secretRef:
              name: kratos-secrets
          securityContext:
            {{- toYaml .Values.kratos.containerSecurityContext | nindent 12 }}
          resources:
            limits:
              memory: {{ .Values.kratos.resources.memory }}
            requests:
              cpu: {{ .Values.kratos.resources.cpu }}
              memory: {{ .Values.kratos.resources.memory }}
