apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    {{- include "vikunja.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/component: postgres
  name: postgres
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja
      app.kubernetes.io/component: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: vikunja
        app.kubernetes.io/component: postgres
    spec:
      volumes:
      - name: postgres-admin
        secret:
          secretName: postgres-admin
          defaultMode: 0440
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: tmp
        emptyDir: {}
      - name: run
        emptyDir: {}
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      hostNetwork: false
      containers:
      - name: postgres
        image: {{ .Values.images.postgres }}
        volumeMounts:
        - name: postgres-admin
          mountPath: /etc/secrets/postgres-admin
          readOnly: true
        - name: postgres-data
          mountPath: /var/lib/postgresql
        - name: tmp
          mountPath: /tmp
        - name: run
          mountPath: /var/run/postgresql
        env:
        - name: POSTGRES_USER_FILE
          value: /etc/secrets/postgres-admin/user
        - name: POSTGRES_PASSWORD_FILE
          value: /etc/secrets/postgres-admin/pass
        - name: POSTGRES_DB
          value: vikunja 
        securityContext:
          {{- toYaml .Values.podSecurityContext | nindent 10 }}
        resources:
          {{- include "vikunja.resources" .Values.resources.postgres | nindent 10 }}
