apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: formbricks
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fluufff/infra-argocd.git
    targetRevision: feat/formbricks
    path: charts/formbricks
    helm:
      releaseName: formbricks
  destination:
    server: "https://kubernetes.default.svc"
    namespace: formbricks
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - kind: Secret
      jqPathExpressions:
        - .data
