apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: platyplus
data:
  default.conf: |
    server {
      listen 0.0.0.0:80;
      root /var/www/html;

      index index.php;

      client_max_body_size 50M;

      # Block accesses to restricted Platy+ directories
      location ^~ /platyplus {
          deny all;
          return 404;
      }
      location ^~ /system {
          deny all;
          return 404;
      }
      location ^~ /assets {
          allow all;
      }
      location ^~ /assets/badges {
          deny all;
          return 404;
      }
      location ^~ /assets/private {
          deny all;
          return 404;
      }
      location ^~ /assets/invoices {
          deny all;
          return 404;
      }
      location ^~ /website {
          deny all;
          return 404;
      }

      # Disable .htaccess and other hidden files
      location ~ /\. {
          deny all;
          return 404;
      }

      location / {
          try_files $uri /index.php;
      }

      location ~ \.php$ {
          include fastcgi_params;
          fastcgi_pass platyplus-php:9000;
          fastcgi_index index.php;
          fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
      }

      location ~* ^/(assets|files|robots\.txt) { }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: platyplus
  labels:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: nginx
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platyplus
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platyplus
        app.kubernetes.io/component: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /etc/nginx/conf.d
          readOnly: true
          name: nginx-conf
        - mountPath: /var/log/nginx
          name: log
        - name: code
          mountPath: /var/www/html
          readOnly: true
        - name: assets
          mountPath: /var/www/html/assets
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-conf
      - name: log
        emptyDir: {}
      - name: code
        hostPath:
          path: /data/platyplus/code
          type: Directory
      - name: assets
        hostPath:
          path: /data/platyplus/assets
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: platyplus-nginx
  namespace: platyplus
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: nginx
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platyplus
  namespace: platyplus
  labels:
    app.kubernetes.io/name: platyplus
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`registration.next.fluufff.org`)
    services:
    - kind: Service
      name: platyplus-nginx
      port: 80
