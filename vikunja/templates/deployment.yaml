apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    {{- include "vikunja.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: vikunja
  name: vikunja
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja
      app.kubernetes.io/component: vikunja
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: vikunja
        app.kubernetes.io/component: vikunja
    spec:
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      hostNetwork: false
      volumes:
      - name: postgres-admin
        secret:
          secretName: postgres-admin
          defaultMode: 0440
      - name: jwt
        secret:
          secretName: jwt
          defaultMode: 0440
      containers:
      - name: vikunja
        image: {{ .Values.images.vikunja }}
        # args:
        # - run
        # - evaluator
        # - xray
        # - --db-host=postgres
        env:
        - name: VIKUNJA_SERVICE_PUBLICURL
          value: https://vikunja.next.fluufff.org
        - name: VIKUNJA_DATABASE_HOST
          value: postgres
        # - name: VIKUNJA_DATABASE_PASSWORD
        #   value: changeme
        - name: VIKUNJA_DATABASE_PASSWORD_FILE
          value: /etc/secrets/postgres-admin/pass
        - name: VIKUNJA_DATABASE_TYPE
          value: postgres
        # - name: VIKUNJA_DATABASE_USER
        #   value: vikunja
        - name: VIKUNJA_DATABASE_USER_FILE
          value: /etc/secrets/postgres-admin/user
        - name: VIKUNJA_DATABASE_DATABASE
          value: vikunja
        - name: VIKUNJA_SERVICE_JWTSECRET_FILE
          value: /etc/secrets/jwt/secret
        securityContext:
          {{- toYaml .Values.podSecurityContext | nindent 10 }}
        volumeMounts:
        - mountPath: /etc/secrets/postgres-admin
          name: postgres-admin
          readOnly: true
        - mountPath: /etc/secrets/jwt
          name: jwt
          readOnly: true
        - name: data
          mountPath: /app/vikunja/files
          readOnly: true
        resources:
          {{- include "vikunja.resources" .Values.resources.evaluator_xray | nindent 10 }}
