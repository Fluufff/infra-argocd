apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: formbricks
    app.kubernetes.io/component: postgres
  name: postgres
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: formbricks
      app.kubernetes.io/component: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: formbricks
        app.kubernetes.io/component: postgres
    spec:
      volumes:
        - name: postgres-admin
          secret:
            secretName: postgres-admin
            defaultMode: 0440
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      hostNetwork: false
      securityContext:
        {{- toYaml .Values.postgres.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          volumeMounts:
            - name: postgres-admin
              mountPath: /etc/secrets/postgres-admin
              readOnly: true
            - name: postgres-data
              mountPath: /var/lib/postgresql
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          env:
            - name: POSTGRES_USER_FILE
              value: /etc/secrets/postgres-admin/user
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/secrets/postgres-admin/pass
            - name: POSTGRES_DB
              value: formbricks
          securityContext:
            {{- toYaml .Values.postgres.containerSecurityContext | nindent 12 }}
          resources:
            limits:
              memory: {{ .Values.postgres.resources.memory }}
            requests:
              cpu: {{ .Values.postgres.resources.cpu }}
              memory: {{ .Values.postgres.resources.memory }}
