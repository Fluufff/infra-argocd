apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    {{- include "vikunja.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/component: postgres
spec:
  storageClassName: zfs-local
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
