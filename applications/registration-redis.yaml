apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: platyplus
  labels:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platyplus
      app.kubernetes.io/component: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platyplus
        app.kubernetes.io/component: redis
    spec:
      containers:
      - image: docker.io/redis:7
        name: redis
        resources: {}
---
apiVersion: v1
kind: Service
metadata:
  name: platyplus-redis
  namespace: platyplus
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: redis
  ports:
  - name: redis
    port: 6379
    protocol: TCP
    targetPort: 6379
---
