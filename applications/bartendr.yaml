apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bartendr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fluufff/infra-argocd.git
    targetRevision: next
    path: charts/bartendr
    helm:
      releaseName: bartendr
  destination:
    server: "https://kubernetes.default.svc"
    namespace: bartendr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - kind: Secret
      jqPathExpressions:
        - .data
