apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: ory
    app.kubernetes.io/component: selfservice
  name: selfservice
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ory
      app.kubernetes.io/component: selfservice
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: ory
        app.kubernetes.io/component: selfservice
    spec:
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        - name: run
          emptyDir:
            medium: Memory
        - name: dot-npm
          emptyDir:
            medium: Memory
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      hostNetwork: false
      securityContext:
        {{- toYaml .Values.selfservice.podSecurityContext | nindent 8 }}
      containers:
        - name: selfservice
          image: {{ .Values.selfservice.image }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/selfservice
            - name: dot-npm
              mountPath: /home/node/.npm
          env:
            - name: PORT
              value: "4455"
            - name: HYDRA_ADMIN_URL
              value: http://hydra-admin
            - name: KRATOS_PUBLIC_URL
              value: http://kratos-public
            - name: KRATOS_ADMIN_URL
              value: http://kratos-admin
            - name: KRATOS_BROWSER_URL
              value: https://{{ .Values.kratos.domains.public }}
            - name: CSRF_COOKIE_NAME
              value: __HOST-{{ .Values.selfservice.domain }}-x-csrf-token
          envFrom:
            - secretRef:
                name: selfservice-secrets
          securityContext:
            {{- toYaml .Values.selfservice.containerSecurityContext | nindent 12 }}
          resources:
            limits:
              memory: {{ .Values.selfservice.resources.memory }}
            requests:
              cpu: {{ .Values.selfservice.resources.cpu }}
              memory: {{ .Values.selfservice.resources.memory }}
          ports:
            - containerPort: 4455
              name: http
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: selfservice
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: ory
    app.kubernetes.io/component: selfservice
spec:
  type: ClusterIP
  ports:
    - port: 80
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: ory
    app.kubernetes.io/component: selfservice
