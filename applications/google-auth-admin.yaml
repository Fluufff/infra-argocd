apiVersion: "traefik.io/v1alpha1"
kind: "Middleware"
metadata:
  name: "google-oauth-admin"
  namespace: "traefik"
spec:
  forwardAuth:
    address: "http://google-oauth-admin.traefik"
    trustForwardHeader: true
    authResponseHeaders:
      - "X-Forwarded-User"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "google-oauth-admin"
  namespace: "traefik"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "google-oauth-admin"
  template:
    metadata:
      labels:
        app: "google-oauth-admin"
    spec:
      containers:
        - name: "traefik-forward-auth"
          image: "thomseddon/traefik-forward-auth:2"
          env:
            - name: "PROVIDERS_GOOGLE_CLIENT_ID"
              valueFrom:
                secretKeyRef:
                  name: "auth"
                  key: "clientID"

            - name: "PROVIDERS_GOOGLE_CLIENT_SECRET"
              valueFrom:
                secretKeyRef:
                  name: "auth"
                  key: "clientSecret"

            - name: "SECRET"
              valueFrom:
                secretKeyRef:
                  name: "auth"
                  key: "cookieSecret"

            - name: "INSECURE_COOKIE"
              value: "true"

            - name: WHITELIST
              value: juravenator@fluufff.org
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "google-oauth-admin"
  namespace: "traefik"
spec:
  ports:
    - name: "http"
      targetPort: 4181
      port: 80
  selector:
    app: "google-oauth-admin"
