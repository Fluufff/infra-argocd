apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: drinkr
  name: drinkr
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: drinkr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drinkr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: drinkr
          image: "{{ .Values.images.drinkr }}"
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
      volumes:
        - name: cache
          emptyDir:
            medium: Memory
        - name: run
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: drinkr
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: drinkr
spec:
  type: ClusterIP
  ports:
    - port: 80
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: drinkr
