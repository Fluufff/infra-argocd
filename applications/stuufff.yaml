apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stuufff
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fluufff/Stuufff.git
    targetRevision: stable
    path: helm
    helm:
      releaseName: stuufff
  destination:
    server: "https://kubernetes.default.svc"
    namespace: stuufff
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - kind: Secret
      jqPathExpressions:
        - .data
