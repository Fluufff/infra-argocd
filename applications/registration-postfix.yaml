apiVersion: apps/v1
kind: Deployment
metadata:
  name: postfix
  namespace: platyplus
  labels:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: postfix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platyplus
      app.kubernetes.io/component: postfix
  strategy: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platyplus
        app.kubernetes.io/component: postfix
    spec:
      containers:
      - image: docker.io/boky/postfix:5.1.0-debian
        name: postfix
        resources: {}
        envFrom:
        - secretRef:
            name: postfix
        env:
        - name: RELAYHOST
          value: "[smtp.gmail.com]:587"
        - name: RELAYHOST_USERNAME
          value: "support.registration@fluufff.org"
        - name: POSTFIX_inet_protocols
          value: ipv4
---
apiVersion: v1
kind: Service
metadata:
  name: platyplus-mail
  namespace: platyplus
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: postfix
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: postfix
  ports:
  - name: smtp-auth
    port: 587
    protocol: TCP
    targetPort: 587
  - name: smtp-server
    port: 25
    protocol: TCP
    targetPort: 25
---
