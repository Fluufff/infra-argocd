apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookstack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fluufff/infra-argocd.git
    targetRevision: bookstack
    path: bookstack
    helm:
      releaseName: bookstack
  destination:
    server: "https://kubernetes.default.svc"
    namespace: bookstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
  - kind: Secret
    jqPathExpressions:
    - .data
