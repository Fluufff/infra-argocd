apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: ory
    app.kubernetes.io/component: kratos-admin-ui
  name: kratos-admin-ui
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ory
      app.kubernetes.io/component: kratos-admin-ui
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: ory
        app.kubernetes.io/component: kratos-admin-ui
    spec:
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      hostNetwork: false
      securityContext:
        {{- toYaml .Values.kratos_admin_ui.podSecurityContext | nindent 8 }}
      containers:
        - name: kratos-admin-ui
          image: {{ .Values.kratos_admin_ui.image }}
          env:
            - name: KRATOS_PUBLIC_URL
              value: https://{{ .Values.domain }}
            - name: KRATOS_ADMIN_URL
              value: http://kratos-admin
            - name: HYDRA_ADMIN_URL
              value: http://hydra-admin
            - name: HYDRA_PUBLIC_URL
              value: https://{{ .Values.domain }}
          securityContext:
            {{- toYaml .Values.kratos_admin_ui.containerSecurityContext | nindent 12 }}
          resources:
            limits:
              memory: {{ .Values.kratos_admin_ui.resources.memory }}
            requests:
              cpu: {{ .Values.kratos_admin_ui.resources.cpu }}
              memory: {{ .Values.kratos_admin_ui.resources.memory }}
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kratos-admin-ui
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: ory
    app.kubernetes.io/component: kratos-admin-ui
spec:
  type: ClusterIP
  ports:
    - port: 80
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: ory
    app.kubernetes.io/component: kratos-admin-ui
