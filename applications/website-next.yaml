apiVersion: v1
kind: Namespace
metadata:
  name: website-next
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-next
  namespace: website-next
  labels:
    app: website-next
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website-next
  strategy: {}
  template:
    metadata:
      labels:
        app: website-next
    spec:
      containers:
      - image: ghcr.io/fluufff/website:latest
        name: website-next
        resources: {}
---
apiVersion: v1
kind: Service
metadata:
  name: website-next
  namespace: website-next
  labels:
    app: website-next
spec:
  ports:
  - name: 80-80
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: website-next
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: website-next
  namespace: website-next
  labels:
    app: website-next
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`www.next.fluufff.org`) || Host(`next.fluufff.org`)
    services:
    - kind: Service
      name: website-next
      port: 80
---
# Used by GitHub CI to push image updates
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions
  namespace: website-next
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: update-website-image
  namespace: website-next
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["website-next"]
  verbs: ["update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-update-website-image
  namespace: website-next
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: update-website-image
subjects:
- kind: ServiceAccount
  name: github-actions
---
# Used by SecHub instances to read the cluster
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: github-actions-token
  namespace: website-next
  annotations:
    kubernetes.io/service-account.name: github-actions
