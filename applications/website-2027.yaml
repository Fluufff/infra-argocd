apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website-2027
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Fluufff/website-2027.git
    targetRevision: feat/setup
    path: helm
    helm:
      releaseName: website-2027
  destination:
    server: "https://kubernetes.default.svc"
    namespace: website-2027
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
