apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    {{- include "leantime.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: leantime
  name: leantime
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: leantime
      app.kubernetes.io/component: leantime
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: leantime
        app.kubernetes.io/component: leantime
    spec:
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      hostNetwork: false
      volumes:
      - name: logs
        emptyDir: {}
      - name: plugins
        persistentVolumeClaim:
          claimName: plugins
      - name: userfiles
        persistentVolumeClaim:
          claimName: userfiles
      - name: public-userfiles
        persistentVolumeClaim:
          claimName: public-userfiles
      containers:
      - name: leantime
        image: {{ .Values.images.leantime }}
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: LEAN_PORT
          value: '8080'
        - name: LEAN_APP_URL
          value: https://leantime.next.fluufff.org
        - name: LEAN_DB_HOST
          value: mysql
        - name: LEAN_DB_DATABASE
          value: leantime
        - name: LEAN_DB_PORT
          value: '3306'
        - name: LEAN_DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-user
              key: user
        - name: LEAN_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-user
              key: pass
        - name: LEAN_SESSION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lean-session
              key: pass
        - name: LEAN_SESSION_EXPIRATION
          value: '28800'
        - name: LEAN_SESSION_SECURE
          value: 'false'
        securityContext:
          {{- toYaml .Values.podSecurityContext.leantime | nindent 10 }}
        volumeMounts:
        - name: logs
          mountPath: /var/www/html/storage/logs
          readOnly: false
        - name: plugins
          mountPath: /var/www/html/app/Plugins
          readOnly: false
        - name: userfiles
          mountPath: /var/www/html/userfiles
          readOnly: false
        - name: public-userfiles
          mountPath: /var/www/html/public/userfiles
          readOnly: false
        resources:
          {{- include "leantime.resources" .Values.resources.leantime | nindent 10 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "lean-session"
type: Opaque
data:
  pass: {{ randAlphaNum 32 | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "leantime.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: leantime
  name: leantime
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app.kubernetes.io/name: leantime
    app.kubernetes.io/component: leantime
  type: ClusterIP
