apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openproject
  namespace: argocd
spec:
  project: default
  source:
    chart: openproject
    repoURL: https://charts.openproject.org
    targetRevision: 11.5.0
    helm:
      releaseName: openproject
      valuesObject:
        ingress:
          enabled: true
          host: openproject.next.fluufff.org
          tls:
            enabled: false
        persistence:
          accessModes:
          - ReadWriteOnce
          storageClassName: zfs-local
        openproject:
          useTmpVolumes: false
        appInit:
          resources:
            limits:
              memory: null
  destination:
    server: "https://kubernetes.default.svc"
    namespace: openproject
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true