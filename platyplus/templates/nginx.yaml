apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
data:
  nginx.conf: |
    #user  nginx;
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /run/nginx.pid;


    events {
        worker_connections  1024;
    }


    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  65;

        #gzip  on;

        include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |
    server {
      listen 0.0.0.0:80;
      root /var/www/html;

      index index.php;

      client_max_body_size 50M;

      # Block accesses to restricted Platy+ directories
      location ^~ /platyplus {
          deny all;
          return 404;
      }
      location ^~ /system {
          deny all;
          return 404;
      }
      #location ^~ /assets {
      #    allow all;
      #    # try_files $uri /assets2$uri =404;
      #}
      location ^~ /assets/badges {
          deny all;
          return 404;
      }
      location ^~ /assets/private {
          deny all;
          return 404;
      }
      location ^~ /assets/invoices {
          deny all;
          return 404;
      }
      # location ~ ^/assets/(.*) {
      #     try_files /var/www/html/assets/$1 /var/www/assets/$1 =404;
      # }
      # location ^~ /assets/ {
      #     try_files $uri /var/www$uri =404;
      # }
      location ^~ /assets/ {
          root /var/www/html;
          try_files $uri @assets2;
      }
      location @assets2 {
          rewrite ^/assets/(.*)$ /$1 break;
          root /var/www/assets;
      }
      location ^~ /website {
          deny all;
          return 404;
      }

      # Disable .htaccess and other hidden files
      location ~ /\. {
          deny all;
          return 404;
      }

      location / {
          try_files $uri /index.php;
      }

      location ~ \.php$ {
          include fastcgi_params;
          fastcgi_pass platyplus-php:9000;
          fastcgi_index index.php;
          fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
      }

      location ~* ^/(assets|files|robots\.txt) { }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: nginx
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platyplus
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platyplus
        app.kubernetes.io/component: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /etc/nginx/conf.d/default.conf
          readOnly: true
          name: nginx-conf
          subPath: default.conf
        - mountPath: /etc/nginx/nginx.conf
          readOnly: true
          name: nginx-conf
          subPath: nginx.conf
        - mountPath: /var/log/nginx
          name: log
        - name: code
          mountPath: /var/www/html
          readOnly: true
        - name: assets
          mountPath: /var/www/assets
          readOnly: true
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-conf
      - name: log
        emptyDir: {}
      - name: code
        hostPath:
          path: /data/platyplus/code
          type: Directory
      - name: assets
        hostPath:
          path: /data/platyplus/{{ .Values.host }}/assets
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: platyplus-nginx
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app.kubernetes.io/name: platyplus
    app.kubernetes.io/component: nginx
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platyplus
  labels:
    app.kubernetes.io/name: platyplus
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`{{ .Values.host }}`)
    services:
    - kind: Service
      name: platyplus-nginx
      port: 80
