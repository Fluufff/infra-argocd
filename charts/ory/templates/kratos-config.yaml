apiVersion: v1
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: kratos-config
data:
  kratos.yml: |
    cookies:
      domain: next.fluufff.org
      same_site: Lax
    session:
      cookie:
        domain: next.fluufff.org
        same_site: Lax
    serve:
      public:
        base_url: https://{{ .Values.kratos.domains.public }}
        cors:
          enabled: true
      admin:
        base_url: https://{{ .Values.kratos.domains.admin }}

    selfservice:
      default_browser_return_url: https://{{ .Values.selfservice.domain }}
      allowed_return_urls:
      - https://{{ .Values.selfservice.domain }}

      methods:
        password:
          enabled: true
          config:
            min_password_length: 6
            identifier_similarity_check_enabled: false
            haveibeenpwned_enabled: false
        oidc:
          enabled: true
          config:
            providers:
            - id: google
              provider: google
              mapper_url: file:///etc/kratos/oidc.google.jsonnet
              scope:
              - openid
              - profile
              - email

      flows:
        error:
          ui_url: https://{{ .Values.selfservice.domain }}/error
        settings:
          ui_url: https://{{ .Values.selfservice.domain }}/settings
          privileged_session_max_age: 15m
          required_aal: highest_available
        logout:
          after:
            default_browser_return_url: https://{{ .Values.selfservice.domain }}/logout
        login:
          ui_url: https://{{ .Values.selfservice.domain }}/login
        registration:
          ui_url: https://{{ .Values.selfservice.domain }}/registration
          after:
            password:
              hooks:
              - hook: session
    log:
      format: text
      leak_sensitive_values: true
    identity:
      default_schema_id: default
      schemas:
      - id: default
        url: file:///etc/kratos/identity.schema.json
    oauth2_provider:
      url: https://{{ .Values.hydra.domain }}

  oidc.google.jsonnet: |
    // Maps Google OIDC claims into Kratos identity traits.
    local claims = std.extVar('claims');

    // portable coalesce helper that treats null or empty string as absent
    local coalesce(a, b, c) =
      if a != null && a != "" then a
      else if b != null && b != "" then b
      else c;

    {
      identity: {
        traits: {
          // Always use the stable Google "sub" as an identifier in Kratos
          email: claims.email,
          name: coalesce(claims.name, claims.given_name, claims.family_name),
          // You can add more mappings if your schema supports them
          picture: claims.picture,
          email_verified: if claims.email_verified == "true" || claims.email_verified == true then true else false,
          google_sub: claims.sub,
          _raw_claims: claims,
        },
      },
    }

  identity.schema.json: |
    {
      "$id": "https://schemas.ory.sh/presets/kratos/quickstart/email-password/identity.schema.json",
      "$schema": "http://json-schema.org/draft-07/schema#",
      "title": "Person",
      "type": "object",
      "properties": {
        "traits": {
          "type": "object",
          "properties": {
            "picture": { "type": "string", "format": "uri" },
            "email_verified": { "type": "boolean" },
            "google_sub": { "type": "string" },
            "_raw_claims": { "type": "object" },
            "name": {
              "type": "string"
            },
            "email": {
              "type": "string",
              "format": "email",
              "title": "E-Mail",
              "minLength": 3,
              "ory.sh/kratos": {
                "credentials": {
                  "password": {
                    "identifier": true
                  }
                }
              }
            }
          },
          "required": [
            "email"
          ],
          "additionalProperties": false
        }
      }
    }
