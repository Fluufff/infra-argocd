apiVersion: v1
kind: Namespace
metadata:
  name: website-2019
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-2019
  namespace: website-2019
  labels:
    app: website-2019
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website-2019
  strategy: {}
  template:
    metadata:
      labels:
        app: website-2019
    spec:
      containers:
      - image: ghcr.io/fluufff/website-2019:latest
        name: website-2019
        resources: {}
---
apiVersion: v1
kind: Service
metadata:
  name: website-2019
  namespace: website-2019
  labels:
    app: website-2019
spec:
  ports:
  - name: 80-80
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: website-2019
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: website-2019
  namespace: website-2019
  labels:
    app: website-2019
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`2019.fluufff.org`)
    services:
    - kind: Service
      name: website-2019
      port: 80
